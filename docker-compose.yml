services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:18
    volumes:
      - .:/workspace
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Reachable to other services on the Docker network at postgres:5432.
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imprint}
      POSTGRES_DB: ${POSTGRES_DB:-imprint}
    ports:
      - "5432:5432"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imprint} -d ${POSTGRES_DB:-imprint}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
