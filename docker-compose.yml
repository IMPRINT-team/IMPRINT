services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:18
    volumes:
      - .:/workspace
    command: sleep infinity
    depends_on:
      - postgres
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imprint}:${POSTGRES_PASSWORD:-imprint}@postgres:5432/${POSTGRES_DB:-imprint}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - app-network

  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    # Reachable to other services on the Docker network at postgres:5432.
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imprint}
      POSTGRES_DB: ${POSTGRES_DB:-imprint}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
