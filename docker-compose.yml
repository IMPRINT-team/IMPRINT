version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: imprint-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-imprint}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-imprint}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    container_name: imprint-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    ports:
      - "8080:8080"

  web-dashboard:
    build:
      context: ./web-dashboard
    container_name: imprint-web-dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
