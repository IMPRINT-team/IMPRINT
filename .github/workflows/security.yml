name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run to catch newly disclosed CVEs even when code has not changed.
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  npm-audit:
    name: npm audit (critical fail, high warn)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      # Triage policy:
      # - Critical vulnerabilities fail the workflow and must be fixed or explicitly risk-accepted before merge.
      # - High vulnerabilities are surfaced as warnings for triage and can merge with documented follow-up.
      - name: Audit for critical vulnerabilities (fail)
        run: npm audit --workspaces --include-workspace-root --audit-level=critical

      - name: Audit for high vulnerabilities (warn)
        continue-on-error: true
        run: npm audit --workspaces --include-workspace-root --audit-level=high
