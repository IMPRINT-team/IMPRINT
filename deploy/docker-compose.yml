services:
  caddy:
    image: caddy:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: web-dashboard/Dockerfile.prod
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-imprint}:${POSTGRES_PASSWORD:-imprint}@postgres:5432/${POSTGRES_DB:-imprint}}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-imprint}:${POSTGRES_PASSWORD:-imprint}@postgres:5432/${POSTGRES_DB:-imprint}}
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imprint}
      POSTGRES_DB: ${POSTGRES_DB:-imprint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imprint} -d ${POSTGRES_DB:-imprint}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
